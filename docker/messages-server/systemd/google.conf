# Google Messages and Google Voice on this server: install.sh --google puts this file in
# /etc/systemd/system/messages-server.service.d/ after it has installed official Google Chrome, Xvfb and Chrome's policy
# (the Google image's, docker/messages-server/Dockerfile.google), and install.sh --no-google takes it away again.
# The server keeps Chrome running on a virtual display of its own, signed in by hand on the server's page, and lets
# Chrome renew Google's sign-in itself. Nothing about the browser is hidden or changed: no flag that makes it look like
# anything but Google Chrome.
[Service]
Environment=MESSAGES_GOOGLE=1
Environment=MESSAGES_GOOGLE_CHROME=1
Environment=MESSAGES_CHROME=/usr/bin/google-chrome-stable

# Chrome's own sandbox is on (MESSAGES_CHROMIUM_NO_SANDBOX is never set here). It is made of user, PID and network
# namespaces, which the main unit's RestrictNamespaces=yes forbids; these three are allowed again and nothing else (no
# mount, IPC, UTS or cgroup namespaces). The server checks it can make one before it starts Chrome, and logs
# `google chrome sandbox=active` once it has seen every renderer filtered.
RestrictNamespaces=user pid net

# Chrome alone takes 0.6 to 1.2 GB and a few hundred threads: the Google image's limits (README, Limits).
MemoryMax=4G
TasksMax=2048
