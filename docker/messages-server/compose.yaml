# Messages Server with plain Docker Compose. From this folder:
#   docker compose up -d --build      build the image from this checkout and start it
#   docker compose logs messages-server   pairing code and TLS fingerprint
#   docker compose down               stop (SIGTERM, up to 60 s to finish)
# Settings come from the environment or a .env file beside this one (never committed):
#   MESSAGES_APPDATA  host folder for /data: sealed sessions and history, useless without the keys volume. Owned by
#                     2787:2787, mode 700 (default: Unraid appdata)
#   MESSAGES_BIND_IP  the host address to publish the port on, such as the server's LAN address. Without it the port is
#                     published on every interface, a VPN's (Tailscale, WireGuard) included
#   MESSAGES_PORT     host port (default 8787)
#   TZ                time zone for log timestamps (default UTC)
#   MESSAGES_BACKUPS_DIR  host folder for /backups, where the server writes its own backups. Owned by 2787:2787, mode 700
#                     (default: /mnt/user/backups/messages, Unraid's backups share)
#   MESSAGES_TAILNET  1 to reach the server over your tailnet too (README, "Your tailnet"); then MESSAGES_BIND_IP can stay the LAN address
#   MESSAGES_TAILNET_AUTHKEY  a Tailscale auth key (tskey-auth-...) that signs the door in by itself the first time, for a
#                     host with no browser at hand. Only the door is given it; a tagged key turns off its same-user check
#                     (README, "Your tailnet"). Keep it in .env, never in this file.
# The keys live in the named volume messages-server-keys (/keys), inside Docker's own storage and outside every share.
# It also holds this server's Messenger history. Losing it (for example when Docker's image file is recreated) loses
# that history and means signing in and pairing again; nothing leaks. Back it up (README, Backups).
name: messages-server
services:
  messages-server:
    image: messages-server:local
    container_name: messages-server
    build:
      context: ../..
      dockerfile: docker/messages-server/Dockerfile
    # The image's own account, which nothing else on the server uses (not Unraid's nobody:users, 99:100).
    user: "2787:2787"
    # A small init as PID 1 forwards SIGTERM to the server and reaps any helper that outlives it.
    init: true
    environment:
      MESSAGES_DATA: /data
      MESSAGES_KEYS: /keys
      # Resume the accounts signed in on this server when it starts (paced: at most 4 an hour, backing off after crashes).
      MESSAGES_RESTORE: "1"
      # The password of the server's own page (https://<this server>:8787/ in a browser; README, "The server's page"). Empty leaves the page off; 12 characters or more.
      MESSAGES_ADMIN_PASSWORD: "${MESSAGES_ADMIN_PASSWORD:-}"
      # 1 puts the server on your tailnet as a Tailscale machine of its own, named messages-server (README, "Your tailnet"). The first start prints a sign-in link in the logs.
      MESSAGES_TAILNET: "${MESSAGES_TAILNET:-0}"
      # Empty unless .env sets it. The server takes it out of its environment at start and hands it to the door alone.
      MESSAGES_TAILNET_AUTHKEY: "${MESSAGES_TAILNET_AUTHKEY:-}"
      TZ: "${TZ:-Etc/UTC}"
    ports:
      - "${MESSAGES_BIND_IP:-0.0.0.0}:${MESSAGES_PORT:-8787}:8787"
    volumes:
      - "${MESSAGES_APPDATA:-/mnt/user/appdata/messages-server}:/data"
      - "messages-server-keys:/keys"
      # The server's own backups: it writes to /backups whenever the folder is there (README, Backups).
      - "${MESSAGES_BACKUPS_DIR:-/mnt/user/backups/messages}:/backups"
    restart: unless-stopped
    # Room for the server to let pending sends finish and close its helpers; Docker's default 10 s is not enough.
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # What the container may use (README, Limits): memory with no swap beyond it, and threads/processes.
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 1024
volumes:
  # Named outright, so it is the same volume the install script and the Unraid template use, not one prefixed by the project.
  messages-server-keys:
    name: messages-server-keys
